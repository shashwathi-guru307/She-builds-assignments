<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101826;
    --cloud:#F5F7FA;
    --line:rgba(16,24,38,0.14);
    --line-soft:rgba(16,24,38,0.08);
    --amber:#E2A33D;
    --cyan:#5FA8C9;
    --muted:#5B6472;
    --sky-a:#1B2A4A;
    --sky-b:#2E4368;
    --transition: 900ms cubic-bezier(.4,0,.2,1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--cloud);
    background: linear-gradient(160deg, var(--sky-a), var(--sky-b));
    background-attachment: fixed;
    transition: background var(--transition);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 80px;
    position:relative;
    overflow-x:hidden;
  }

  /* subtle isobar texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.35;
    background-image:
      repeating-radial-gradient(circle at 15% 20%, transparent 0, transparent 60px, rgba(255,255,255,0.03) 61px, transparent 62px),
      repeating-radial-gradient(circle at 85% 75%, transparent 0, transparent 90px, rgba(255,255,255,0.03) 91px, transparent 92px);
    z-index:0;
  }

  .wrap{
    width:100%;
    max-width:640px;
    position:relative;
    z-index:1;
  }

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:36px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,0.16);
  }

  .masthead h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:600;
    margin:0;
    letter-spacing:0.01em;
  }

  .masthead .clock{
    font-size:13px;
    color:rgba(245,247,250,0.6);
    font-variant-numeric: tabular-nums;
  }

  form.search{
    display:flex;
    gap:0;
    border-bottom:1px solid rgba(255,255,255,0.35);
    margin-bottom:28px;
    transition:border-color 200ms ease;
  }

  form.search:focus-within{
    border-bottom-color: var(--amber);
  }

  form.search input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--cloud);
    font-family:'Space Grotesk', sans-serif;
    font-size:28px;
    font-weight:500;
    padding:6px 0 14px;
  }

  form.search input::placeholder{
    color:rgba(245,247,250,0.4);
  }

  form.search button{
    background:transparent;
    border:none;
    color:rgba(245,247,250,0.7);
    font-family:'Inter', sans-serif;
    font-size:14px;
    cursor:pointer;
    padding:0 4px 14px 14px;
    transition:color 150ms ease;
  }

  form.search button:hover{ color: var(--amber); }

  .status{
    min-height:22px;
    font-size:14px;
    color:#F2B8B5;
    margin-bottom:8px;
  }

  .status.loading{ color: rgba(245,247,250,0.6); }

  .reading{
    display:none;
  }
  .reading.show{ display:block; }

  .place{
    font-size:15px;
    color:rgba(245,247,250,0.65);
    margin-bottom:2px;
  }

  .hero{
    display:flex;
    align-items:flex-start;
    gap:18px;
    margin:6px 0 8px;
  }

  .hero .temp{
    font-family:'Space Grotesk', sans-serif;
    font-size:104px;
    font-weight:700;
    line-height:1;
    letter-spacing:-0.02em;
  }

  .hero .temp sup{
    font-size:40px;
    font-weight:500;
    vertical-align:22px;
    margin-left:2px;
  }

  .hero .meta{
    padding-top:16px;
  }

  .hero .condition{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    font-weight:600;
  }

  .hero .feels{
    font-size:14px;
    color:rgba(245,247,250,0.6);
    margin-top:4px;
  }

  .updated{
    font-size:12px;
    color:rgba(245,247,250,0.4);
    margin-bottom:32px;
  }

  .strip{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-top:1px solid rgba(255,255,255,0.16);
  }

  .stat{
    padding:18px 4px 0;
    border-right:1px solid rgba(255,255,255,0.16);
  }
  .stat:last-child{ border-right:none; }

  .stat .label{
    font-size:11px;
    letter-spacing:0.02em;
    color:rgba(245,247,250,0.5);
    margin-bottom:6px;
  }

  .stat .value{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:600;
  }

  .stat .value span{
    font-size:13px;
    font-weight:500;
    color:rgba(245,247,250,0.55);
  }

  .empty{
    color:rgba(245,247,250,0.5);
    font-size:14px;
    line-height:1.6;
    max-width:380px;
    padding-top:8px;
  }

  .hint-city{
    color:var(--amber);
    cursor:pointer;
    border-bottom:1px dotted rgba(226,163,61,0.6);
  }

  footer{
    margin-top:56px;
    font-size:12px;
    color:rgba(245,247,250,0.35);
    text-align:center;
  }
  footer a{ color:inherit; }

  @media (max-width: 480px){
    .hero .temp{ font-size:76px; }
    .strip{ grid-template-columns:repeat(2, 1fr); }
    .stat:nth-child(2){ border-right:none; }
    .stat:nth-child(n+3){ border-top:1px solid rgba(255,255,255,0.16); padding-top:14px; margin-top:14px; }
  }

  :focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Station</h1>
    <div class="clock" id="clock"></div>
  </div>

  <form class="search" id="searchForm" role="search" aria-label="Search weather by city">
    <input type="text" id="cityInput" placeholder="Search a city — try Chennai" autocomplete="off" aria-label="City name">
    <button type="submit" id="searchBtn">Search</button>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="empty" id="emptyState">
    No reading yet. Search a city, or try
    <span class="hint-city" data-city="Chennai">Chennai</span>,
    <span class="hint-city" data-city="London">London</span> or
    <span class="hint-city" data-city="Tokyo">Tokyo</span>.
  </div>

  <div class="reading" id="reading">
    <div class="place" id="place"></div>
    <div class="hero">
      <div class="temp" id="temp">--<sup>°C</sup></div>
      <div class="meta">
        <div class="condition" id="condition">—</div>
        <div class="feels" id="feels">Feels like —</div>
      </div>
    </div>
    <div class="updated" id="updated"></div>

    <div class="strip">
      <div class="stat">
        <div class="label">Humidity</div>
        <div class="value" id="humidity">— <span>%</span></div>
      </div>
      <div class="stat">
        <div class="label">Wind</div>
        <div class="value" id="wind">— <span>km/h</span></div>
      </div>
      <div class="stat">
        <div class="label">Precipitation</div>
        <div class="value" id="precip">— <span>mm</span></div>
      </div>
      <div class="stat">
        <div class="label">Direction</div>
        <div class="value" id="direction">—</div>
      </div>
    </div>
  </div>

  <footer>Data from Open-Meteo · no API key required</footer>
</div>

<script>
(function(){

  // ---- WMO weather code lookup: https://open-meteo.com/en/docs ----
  const WEATHER_CODES = {
    0: { label: "Clear sky", sky: ["#1B2A4A", "#3E5B8C"] },
    1: { label: "Mostly clear", sky: ["#1F3352", "#456494"] },
    2: { label: "Partly cloudy", sky: ["#33415A", "#5A6E90"] },
    3: { label: "Overcast", sky: ["#3A4453", "#5C6779"] },
    45: { label: "Fog", sky: ["#4A5361", "#6B7482"] },
    48: { label: "Depositing rime fog", sky: ["#4A5361", "#6B7482"] },
    51: { label: "Light drizzle", sky: ["#324459", "#4E6B85"] },
    53: { label: "Drizzle", sky: ["#2E3F52", "#496480"] },
    55: { label: "Dense drizzle", sky: ["#293A4C", "#425E79"] },
    56: { label: "Freezing drizzle", sky: ["#33445A", "#556E8A"] },
    57: { label: "Dense freezing drizzle", sky: ["#2E3F52", "#4E6980"] },
    61: { label: "Light rain", sky: ["#26364A", "#3E5878"] },
    63: { label: "Rain", sky: ["#20303F", "#37506D"] },
    65: { label: "Heavy rain", sky: ["#1A2836", "#2E4560"] },
    66: { label: "Freezing rain", sky: ["#233245", "#3D5670"] },
    67: { label: "Heavy freezing rain", sky: ["#1D2C3D", "#334C68"] },
    71: { label: "Light snow", sky: ["#3C4A5C", "#697C93"] },
    73: { label: "Snow", sky: ["#37485C", "#607691"] },
    75: { label: "Heavy snow", sky: ["#2F4056", "#546C8A"] },
    77: { label: "Snow grains", sky: ["#3C4A5C", "#697C93"] },
    80: { label: "Light showers", sky: ["#26364A", "#3E5878"] },
    81: { label: "Showers", sky: ["#20303F", "#37506D"] },
    82: { label: "Violent showers", sky: ["#182430", "#2A4159"] },
    85: { label: "Snow showers", sky: ["#37485C", "#607691"] },
    86: { label: "Heavy snow showers", sky: ["#2F4056", "#546C8A"] },
    95: { label: "Thunderstorm", sky: ["#161E29", "#293849"] },
    96: { label: "Thunderstorm, light hail", sky: ["#151C25", "#243342"] },
    99: { label: "Thunderstorm, heavy hail", sky: ["#12181F", "#202D3A"] },
  };

  const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  function degToCompass(deg){
    return COMPASS[Math.round(deg / 22.5) % 16];
  }

  // ---- element refs ----
  const form = document.getElementById('searchForm');
  const input = document.getElementById('cityInput');
  const statusEl = document.getElementById('status');
  const emptyState = document.getElementById('emptyState');
  const reading = document.getElementById('reading');
  const btn = document.getElementById('searchBtn');

  function setStatus(message, kind){
    statusEl.textContent = message || '';
    statusEl.className = 'status' + (kind === 'loading' ? ' loading' : '');
  }

  function setLoading(isLoading){
    btn.disabled = isLoading;
    input.disabled = isLoading;
  }

  function applySkyTheme(code){
    const entry = WEATHER_CODES[code];
    const [a, b] = entry ? entry.sky : ["#1B2A4A", "#2E4368"];
    document.body.style.background = `linear-gradient(160deg, ${a}, ${b})`;
  }

  // ---- geocoding: turn a city name into lat/lon ----
  async function geocodeCity(name){
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`;
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error(`Location lookup failed (status ${res.status}). Try again in a moment.`);
    }
    const data = await res.json();
    if (!data.results || data.results.length === 0) {
      throw new Error(`Couldn't find a city called "${name}". Check the spelling and try again.`);
    }
    const place = data.results[0];
    return {
      name: place.name,
      admin1: place.admin1,
      country: place.country,
      latitude: place.latitude,
      longitude: place.longitude,
    };
  }

  // ---- forecast: current conditions for a lat/lon ----
  async function fetchCurrentWeather(lat, lon){
    const params = new URLSearchParams({
      latitude: lat,
      longitude: lon,
      current: [
        "temperature_2m",
        "relative_humidity_2m",
        "apparent_temperature",
        "precipitation",
        "weather_code",
        "wind_speed_10m",
        "wind_direction_10m",
      ].join(","),
      timezone: "auto",
    });
    const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error(`Weather service returned an error (status ${res.status}). Try again shortly.`);
    }
    const data = await res.json();
    if (!data.current) {
      throw new Error("The weather service didn't return current conditions for that location.");
    }
    return data.current;
  }

  function renderReading(place, current){
    const code = current.weather_code;
    const entry = WEATHER_CODES[code];

    document.getElementById('place').textContent =
      [place.name, place.admin1, place.country].filter(Boolean).join(", ");
    document.getElementById('temp').innerHTML =
      `${Math.round(current.temperature_2m)}<sup>°C</sup>`;
    document.getElementById('condition').textContent = entry ? entry.label : "Conditions unavailable";
    document.getElementById('feels').textContent =
      `Feels like ${Math.round(current.apparent_temperature)}°C`;
    document.getElementById('humidity').innerHTML = `${Math.round(current.relative_humidity_2m)} <span>%</span>`;
    document.getElementById('wind').innerHTML = `${Math.round(current.wind_speed_10m)} <span>km/h</span>`;
    document.getElementById('precip').innerHTML = `${current.precipitation ?? 0} <span>mm</span>`;
    document.getElementById('direction').textContent = degToCompass(current.wind_direction_10m);

    const updatedTime = new Date(current.time);
    document.getElementById('updated').textContent =
      `Updated ${updatedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    applySkyTheme(code);

    emptyState.style.display = 'none';
    reading.classList.add('show');
  }

  async function searchCity(cityName){
    const trimmed = cityName.trim();

    // ---- input validation ----
    if (!trimmed) {
      setStatus("Type a city name to search.", 'error');
      return;
    }
    if (trimmed.length < 2) {
      setStatus("City name is too short — try a full name.", 'error');
      return;
    }
    if (!/^[a-zA-Z\s\-'.,]+$/.test(trimmed)) {
      setStatus("City names can only contain letters, spaces and hyphens.", 'error');
      return;
    }

    setLoading(true);
    setStatus("Searching…", 'loading');

    try {
      const place = await geocodeCity(trimmed);
      setStatus(`Fetching conditions for ${place.name}…`, 'loading');
      const current = await fetchCurrentWeather(place.latitude, place.longitude);
      renderReading(place, current);
      setStatus('');
    } catch (err) {
      // ---- error handling: network failure vs. known errors ----
      if (err instanceof TypeError) {
        setStatus("Network error — check your connection and try again.", 'error');
      } else {
        setStatus(err.message || "Something went wrong. Please try again.", 'error');
      }
      console.error("Weather lookup failed:", err);
    } finally {
      setLoading(false);
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    searchCity(input.value);
  });

  document.querySelectorAll('.hint-city').forEach(el => {
    el.addEventListener('click', () => {
      input.value = el.dataset.city;
      searchCity(el.dataset.city);
    });
  });

  // ---- live clock in masthead ----
  function tickClock(){
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // load a default city on first visit
  searchCity("Chennai");

})();
</script>
</body>
</html>
